services:
  db:
    build:
      context: ./db
    # tag = Postgres major, so a leftover 14 image (cryptogram/db:latest) is
    # never started on the 18 mount path below — it would initialize an
    # empty cluster in an anonymous volume
    image: cryptogram/db:18
    # without an explicit config_file, postgres ignores the mounted
    # postgresql.conf and runs on image defaults
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_SU_PASSWORD}
      - PG_WRITER_PASSWORD=${PG_WRITER_PASSWORD}
      - PG_READER_PASSWORD=${PG_READER_PASSWORD}
    volumes:
      # Postgres 18 keeps its cluster in <volume>/18/docker. A volume from
      # Postgres 14 (cluster at the volume root) is refused at startup —
      # see "Postgres major upgrades" in docs/infrastructure/README.md
      - pgdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - cryptogram
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1m
      timeout: 5s
      retries: 5
      # fast probing during startup so dependents aren't held for the full
      # 1m interval on first boot (fresh cluster init takes several seconds)
      start_period: 2m
      start_interval: 2s
    ports:
      - 127.0.0.1:5432:5432
    stop_signal: SIGINT
    stop_grace_period: 1m
    restart: unless-stopped

  # one instance for sessions, the Socket.IO pub/sub adapter and app data —
  # the key prefixes are disjoint and nothing here is persisted (--save "").
  # No eviction policy on purpose: sessions and the captcha HMAC key are not
  # cache entries and must never be evicted.
  redis:
    image: redis:6.2.23-alpine@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 6GB --save ""
    networks:
      - cryptogram
    restart: unless-stopped

  wsapi:
    image: cryptogram/backend
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/wsapi.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # one all-in-one `weed server` process instead of separate master/volume/filer
  # containers: -s3 implies -filer, so this single service serves master 9333,
  # volume 8080, filer 8888 and the S3 gateway on 8333. Only 8333 (alias
  # s3.local) is consumed by anything else in the stack.
  # -s3.port.iceberg=0 turns off the Iceberg REST catalog that 4.40+ otherwise
  # starts on 8181 — nothing here speaks Iceberg.
  # Volume blobs and the filer leveldb (filerldb2/) share one /data volume, so a
  # filesystem snapshot of it is atomic across blobs and metadata.
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: "server -dir=/data -ip=seaweed -master.volumeSizeLimitMB=16 -volume.max=0 -volume.preStopSeconds=1 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -s3.port.iceberg=0"
    restart: unless-stopped
    networks:
      cryptogram:
        aliases:
          - s3.local
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: 1
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: 1
    volumes:
      - ./s3_config/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  migrate-db:
    image: cryptogram/backend
    environment: 
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET=${S3_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
    # Gate on a HEALTHY db (same as docker-compose.selfhost.yml): on a fresh
    # volume postgres initializes for several seconds, migrateDb.js does not
    # retry, and the restart policy's immediate retries are spent before the
    # db accepts connections — leaving no schema and no `mediasoup` role.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cryptogram
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 2
        window: 60s
    command: node /dist/migrateDb.js
    stop_grace_period: 1m

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile_dev_stage_1
    image: cryptogram/backend
    environment: 
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      - TWITTER_OAUTH2_CLIENT_ID=${TWITTER_OAUTH2_CLIENT_ID}
      - TWITTER_OAUTH2_CLIENT_SECRET=${TWITTER_OAUTH2_CLIENT_SECRET}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - IMAGE_MODERATION_ENABLED=${IMAGE_MODERATION_ENABLED:-true}
      - IMAGE_MODERATION_THRESHOLD=${IMAGE_MODERATION_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${IMAGE_MODERATION_MODEL_PATH:-}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:-}
      # outgoing mail; unset = the mailpit catcher below, empty SMTP_HOST =
      # email disabled (docs/email-notifications)
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT-1025}
      - SMTP_SECURITY=${SMTP_SECURITY-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - PLATFORM_OPERATOR_USER_IDS=${PLATFORM_OPERATOR_USER_IDS:-}
      - BOT_USER_OWNER_LIMIT=${BOT_USER_OWNER_LIMIT:-5}
      - BOT_COMMUNITY_OWNER_LIMIT=${BOT_COMMUNITY_OWNER_LIMIT:-10}
      - BOT_PLATFORM_OWNER_LIMIT=${BOT_PLATFORM_OWNER_LIMIT:-10}
      - BOT_ACTIVE_TOKEN_LIMIT=${BOT_ACTIVE_TOKEN_LIMIT:-10}
      - BOT_API_RATE_LIMIT_PER_MINUTE=${BOT_API_RATE_LIMIT_PER_MINUTE:-120}
      - BOT_MESSAGE_RATE_LIMIT_PER_MINUTE=${BOT_MESSAGE_RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - db
      - redis
      - seaweed
      - memberlist
    networks:
      - cryptogram
    volumes:
      - "./vapid_keys.json:/run/secrets/vapid_keys_json:ro"
      - "./api_data:/api_data:ro"
    command: ["node", "/dist/api.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  memberlist:
    image: cryptogram/backend
    environment: 
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
    depends_on:
      - db
    networks:
      - cryptogram
    command: ["node", "/dist/memberlist.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  job-runner:
    image: cryptogram/backend
    environment: 
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT-1025}
      - SMTP_SECURITY=${SMTP_SECURITY-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
    depends_on:
      - db
      - redis
      - seaweed
    networks:
      - cryptogram
    command: ["node", "/dist/jobs.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  mediasoup:
    image: cryptogram/backend
    environment: 
      - DB_TYPE=mediasoup
      - PG_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      - HTTPS_CERT_FULLCHAIN=/dist/mediasoup/certs/nginx_certs/server-complete.pem
      - HTTPS_CERT_PRIVKEY=/dist/mediasoup/certs/nginx_certs/key.pem
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - DOMAIN=${MEDIASOUP_ANNOUNCED_IP}
      - INTERACTIVE=false
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
      - MEDIASOUP_DISABLE_LIBURING=${MEDIASOUP_DISABLE_LIBURING}
    volumes:
      - "./nginx/certs:/dist/mediasoup/certs"
    # the `mediasoup` DB role (and its password) is created by a migration, so
    # on a fresh database the first connection fails until migrate-db is done
    # — and with restart "no" the container would stay dead
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - cryptogram
    command: ["node", "/dist/mediasoup.js"]
    ports:
      - "${EXTERNAL_LISTEN_IP}:4443:4443/tcp"
      - "${EXTERNAL_LISTEN_IP}:40000-40099:40000-40099/udp"
    restart: "no"

  onchain:
    image: cryptogram/backend
    environment: 
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      - S3_SECRET=${S3_SECRET}
      - QUIKNODE_ETH=${QUIKNODE_ETH}
      - QUIKNODE_BSC=${QUIKNODE_BSC}
      - QUIKNODE_MATIC=${QUIKNODE_MATIC}
      - QUIKNODE_XDAI=${QUIKNODE_XDAI}
      - QUIKNODE_FANTOM=${QUIKNODE_FANTOM}
      - QUIKNODE_AVAX=${QUIKNODE_AVAX}
      - QUIKNODE_ARBITRUM=${QUIKNODE_ARBITRUM}
      - QUIKNODE_OPTIMISM=${QUIKNODE_OPTIMISM}
      - QUIKNODE_BASE=${QUIKNODE_BASE}
      - INFURA_LINEA=${INFURA_LINEA}
      - QUIKNODE_ARBITRUM_NOVA=${QUIKNODE_ARBITRUM_NOVA}
      - QUIKNODE_CELO=${QUIKNODE_CELO}
      - QUIKNODE_POLYGON_ZKEVM=${QUIKNODE_POLYGON_ZKEVM}
      - QUIKNODE_SCROLL=${QUIKNODE_SCROLL}
      - QUIKNODE_ZKSYNC=${QUIKNODE_ZKSYNC}
      - QUIKNODE_LUKSO=${QUIKNODE_LUKSO}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - RECALCULATE_BALANCES_AND_ROLES=${RECALCULATE_BALANCES_AND_ROLES}
      - BASE_URL=${BASE_URL}
      - IMAGE_MODERATION_ENABLED=${IMAGE_MODERATION_ENABLED:-true}
      - IMAGE_MODERATION_THRESHOLD=${IMAGE_MODERATION_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${IMAGE_MODERATION_MODEL_PATH:-}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/onchain.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile_dev
      args:
        - NGINX_EXPOSED_ON=${LOCAL_CERTIFICATE_IP}
    ports:
      - ${EXTERNAL_LISTEN_IP}:8000:80
      - ${EXTERNAL_LISTEN_IP}:8001:443
    image: cryptogram/nginx
    depends_on:
      - api
    networks:
      - cryptogram
    restart: unless-stopped

  # catches every mail the dev stack sends (nothing leaves the machine); web
  # UI on http://<EXTERNAL_LISTEN_IP>:8025, SMTP on mailpit:1025 inside the
  # network only
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      # careful with EXTERNAL_LISTEN_IP=0.0.0.0: the web UI has no login and
      # shows every caught mail, login codes and verification links included —
      # anyone on the network could log in as any account that uses them
      - ${EXTERNAL_LISTEN_IP}:8025:8025
    networks:
      - cryptogram
    restart: unless-stopped

  hardhat:
    build:
      context: ./hardhat
    image: cryptogram/hardhat
    command: npx --no hardhat node
    user: hardhat
    ports:
      - ${EXTERNAL_LISTEN_IP}:8545:8545
    networks:
      - cryptogram
    stop_grace_period: 5s
    restart: unless-stopped

  # pgadmin:
  #   container_name: pgadmin4_container
  #   image: dpage/pgadmin4:5.5
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_SECRET}
  #     PGADMIN_LISTEN_PORT: 80
  #   ports:
  #     - 127.0.0.1:8080:80
  #   networks:
  #     - cryptogram
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin

  cg-builder:
    build:
      context: ./node
      args:
        - BUILDER_UID=${BUILDER_UID}
        - BUILDER_GID=${BUILDER_GID}
    image: commonground/node
    user: "${BUILDER_UID}:${BUILDER_GID}"
    environment:
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
      - S3_SECRET=${S3_SECRET}
      - YARN_CACHE_FOLDER=/builder-cache
      - YARN_ENABLE_GLOBAL_CACHE=false
      - BUILDER_UID=${BUILDER_UID}
      - BUILDER_GID=${BUILDER_GID}
    restart: "no"
    volumes:
      - ../:/cg
      - builder-cache:/builder-cache
    networks:
      - cryptogram
    command: ["echo", "Not running interactive, exiting..."]

volumes:
  pgdata:
  pgadmin-data:
  seaweedfs-data:
  builder-cache:

networks:
  cryptogram:
    attachable: true
