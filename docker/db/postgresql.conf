# Common Ground — PostgreSQL 18 server configuration
#
# Both compose files start postgres with
#   postgres -c config_file=/etc/postgresql/postgresql.conf
# and mount this file there. It REPLACES the postgresql.conf that initdb writes
# into the data directory, so the values initdb would have set there
# (shared_buffers = 128MB, timezone = 'Etc/UTC', lc_* = 'en_US.utf8',
# default_text_search_config = 'pg_catalog.english') do not apply: anything not
# listed here runs on PostgreSQL 18's built-in default. In particular the
# session TimeZone stays 'GMT' and default_text_search_config stays
# 'pg_catalog.simple', exactly as on the previous PostgreSQL 14 setup (the
# search triggers name 'simple' explicitly anyway).
#
# Sized for the self-host reference machine (16 GB RAM, SSD) that also runs
# the backend services, Redis (REDIS_MAXMEMORY, 1.5 GB by default), SeaweedFS
# and mediasoup. Larger instances: raise shared_buffers (~25 % of the RAM
# Postgres may use) and effective_cache_size (~50-75 %). Every setting can be
# checked at runtime with
#   ./selfhost/selfhost.sh compose exec db psql -U postgres -c 'SHOW <name>'
# Reference: https://www.postgresql.org/docs/18/runtime-config.html

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------

# Inside the container '*' means its own interfaces only: loopback and the
# compose network. Other containers reach the db as `db:5432`; the dev stack
# additionally publishes it on the host's 127.0.0.1:5432, the self-host stack
# publishes nothing. Every login from outside the container needs a password
# (the image's pg_hba.conf: `host all all all scram-sha-256`); the unix socket
# and loopback inside the container are `trust`.
listen_addresses = '*'

# Each backend process (api, wsapi, memberlist, job-runner, onchain,
# mediasoup) uses up to two pools (TypeORM, srv/util/postgres.ts), each
# capped at the node-postgres default of 10 connections, plus the transient
# migrate-db run and admin sessions. 200 leaves headroom;
# superuser_reserved_connections keeps its default of 3.
max_connections = 200

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

# Allocated as anonymous shared memory (shared_memory_type = mmap), so it is
# not limited by the container's shm_size (256m), which only backs parallel
# query segments (dynamic_shared_memory_type = posix).
shared_buffers = 1GB

# Planner hint only (no allocation): how much of the data the OS page cache
# plus shared_buffers is likely to hold.
effective_cache_size = 4GB

# Per sort/hash operation, so a complex query can use several times this and
# it multiplies with concurrent queries. 8MB (default 4MB) is a moderate step
# for a 16 GB host; raise it only after checking for temp-file spills.
work_mem = 8MB

# Index builds (migrations, pg_restore) and autovacuum workers (3 by default,
# each limited by autovacuum_work_mem = -1, i.e. this value).
maintenance_work_mem = 256MB

#------------------------------------------------------------------------------
# PLANNER
#------------------------------------------------------------------------------

# SSD storage: random reads cost about as much as sequential ones.
random_page_cost = 1.1

# JIT compilation pays off for long analytic queries, not for the short OLTP
# queries this app runs; with large row estimates it adds compile time to a
# query that would otherwise finish in milliseconds.
jit = off

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

# Fewer forced checkpoints during bulk work (restores, large migrations).
max_wal_size = 2GB

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log lock waits longer than deadlock_timeout (1s). The message names the
# processes and locks, not the statement text (log_min_error_statement stays
# at its default, ERROR).
log_lock_waits = on

# Left at their PostgreSQL 18 defaults on purpose:
#   io_method = worker        (io_uring needs a seccomp profile Docker's
#                              default does not allow)
#   effective_io_concurrency = 16, password_encryption = scram-sha-256,
#   log_checkpoints = on, log_autovacuum_min_duration = 10min
#   log_min_duration_statement = -1 (statement text can contain user content)
