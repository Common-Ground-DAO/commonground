## Final hop of the mail relay (imported by maddy.conf): look up the
## recipient domain's MX and deliver over port 25. The relay is the only
## component of the stack that sends to port 25 — by design, not enforced:
## the app containers have ordinary outbound access too. To enforce it, block
## outbound 25/tcp on the host for everything but this container (e.g. in
## the DOCKER-USER iptables chain). Kept in its own file so a test setup can
## swap in a catcher (target.smtp) without touching the signing/queueing
## config.

target.remote outbound_delivery {
    # the PTR record of the server's IPv4 must point back to MAIL_HOSTNAME;
    # IPv6 is skipped because many hosters can't set a PTR for it (and the
    # default docker network has no IPv6 anyway)
    force_ipv4 yes
    limits {
        destination rate 20 1s
        destination concurrency 10
    }
    mx_auth {
        # honour MTA-STS policies of the recipient domains
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        # require TLS towards the recipient's MX (unauthenticated TLS is
        # enough; MTA-STS raises it where the domain asks for it)
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}
