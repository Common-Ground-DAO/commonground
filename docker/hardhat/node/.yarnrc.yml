nodeLinker: node-modules

# This image had no Yarn configuration at all until 2026-08-04: `RUN yarn` in
# docker/hardhat/Dockerfile resolved through the node image's bundled **Yarn
# 1.22**, with no lockfile, no cooldown, and lifecycle scripts on — the most
# exposed install path in the repository. The Dockerfile now enables corepack
# and pins Yarn 4 via `packageManager` in this directory's package.json, so the
# two controls the rest of the repo uses apply here too.
#
# There is deliberately no `dependenciesMeta` allowlist: the contracts workspace
# proved the same Hardhat toolchain installs and deploys fine with every build
# script disabled (the native crypto modules fall back to their JS
# implementations), so nothing here needs to execute at install time.
enableScripts: false
npmMinimalAgeGate: 1w
