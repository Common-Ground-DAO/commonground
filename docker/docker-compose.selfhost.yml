# Self-hosted, single-server production deployment of Common Ground.
#
# Differences from the dev compose file (docker-compose.yml):
#   - caddy terminates TLS for the app, the CG ID subdomain and mediasoup
#     call signalling — Let's Encrypt by default, or its own local CA with
#     CG_TLS_MODE=internal (LAN/test instances without public DNS)
#   - nginx is built from Dockerfile_selfhost (real domains, instance-config
#     injection, parameterized CSP)
#   - DEPLOYMENT=prod: full production semantics on any domain
#   - no hardhat dev chain, no test contracts
#   - postgres actually loads the tuned postgresql.conf
#   - Valkey memory tuned for a small single machine: REDIS_MAXMEMORY for the
#     state instance (redis), REDIS_CACHE_MAXMEMORY for the cache instance
#     (redis-cache)
#   - the mediasoup (calls) and onchain (blockchain) services sit behind the
#     compose profiles "calls" and "blockchain"; selfhost.sh derives
#     COMPOSE_PROFILES from CG_ENABLE_CALLS / CG_ENABLE_BLOCKCHAIN, both of
#     which default to true
#   - the send-only mail relay (mail) sits behind the profile "mail",
#     switched by CG_ENABLE_MAIL (init.sh writes true; unset = off, so an
#     older .env.selfhost does not start sending mail on its own)
#
# Usage: see docker/SELFHOST.md. Never run this with the dev docker/.env —
# use docker/selfhost/init.sh to generate .env.selfhost with fresh secrets.

# distinct project name: containers and volumes stay separate from the dev
# stack (docker-compose.yml) even when both live in the same directory
name: cg-selfhost

services:
  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "4443:4443"
    environment:
      - CG_DOMAIN=${CG_DOMAIN}
      - CG_ID_DOMAIN=${CG_ID_DOMAIN}
      - CG_ACME_EMAIL=${CG_ACME_EMAIL}
      - CG_TLS_MODE=${CG_TLS_MODE:-acme}
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - cryptogram
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile_selfhost
      args:
        - SERVER_NAME=${CG_DOMAIN}
        - CGID_SERVER_NAME=${CG_ID_DOMAIN}
    image: cryptogram/nginx-selfhost
    environment:
      - CG_DEPLOYMENT=prod
      - CG_APP_URL=https://${CG_DOMAIN}
      # instance config (inject-instance-config.sh): passkeys on this origin
      # unless CG_LEGACY_CGID=true; CG_CGID_URL is only emitted in legacy mode
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - CG_PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_CGID_URL=https://${CG_ID_DOMAIN:-}/#
      - CG_RECAPTCHA_SITE_KEY=${CG_RECAPTCHA_SITE_KEY}
      - CG_CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - CG_FEATURE_EMAIL=${SMTP_HOST:+true}
      - CG_FEATURE_TWITTER=${TWITTER_API_KEY:+true}
      - CG_ENABLE_CALLS=${CG_ENABLE_CALLS:-true}
      - CG_ENABLE_IMAGE_FILTER=${CG_ENABLE_IMAGE_FILTER:-true}
      - CG_IMAGE_FILTER_THRESHOLD=${CG_IMAGE_FILTER_THRESHOLD:-}
      - CG_GIPHY_API_KEY=${CG_GIPHY_API_KEY}
      - CG_WALLETCONNECT_PROJECT_ID=${CG_WALLETCONNECT_PROJECT_ID}
    depends_on:
      - api
    networks:
      - cryptogram
    restart: unless-stopped

  db:
    build:
      context: ./db
    # tag = Postgres major, so a leftover 14 image (cryptogram/db:latest) is
    # never started on the 18 mount path below — it would initialize an
    # empty cluster in an anonymous volume
    image: cryptogram/db:18
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_SU_PASSWORD}
      - PG_WRITER_PASSWORD=${PG_WRITER_PASSWORD}
      - PG_READER_PASSWORD=${PG_READER_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
    volumes:
      # Postgres 18 keeps its cluster in <volume>/18/docker. A volume from
      # Postgres 14 (cluster at the volume root) is refused at startup —
      # see "Postgres major upgrades" in docs/infrastructure/README.md
      - pgdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - cryptogram
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1m
      timeout: 5s
      retries: 5
      # fast probing during startup so dependents aren't held for the full
      # 1m interval on first boot (fresh cluster init takes several seconds)
      start_period: 2m
      start_interval: 2s
    stop_signal: SIGINT
    stop_grace_period: 1m
    restart: unless-stopped

  # Valkey (Redis-protocol compatible), two instances split by what may be
  # lost — see docs/infrastructure/README.md#redis-and-redis-cache-valkey.
  # `redis` holds state: sessions, the Socket.IO pub/sub, rate-limit windows,
  # replay guards, the shared captcha key, presence. No eviction (a full
  # instance refuses writes instead of silently dropping a session) and RDB
  # snapshots in a volume, so a restart or update does not log everyone out.
  # A failed background save must not stop writes: losing the last minutes of
  # state on a crash is better than refusing every login. Not published on
  # the host.
  redis:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-1024mb} --maxmemory-policy noeviction --save "900 1 300 100" --stop-writes-on-bgsave-error no --appendonly no
    environment:
      # lets valkey-cli in the healthcheck authenticate without a command-line password
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      # healthy once the server answers an authenticated PING
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    volumes:
      - valkey-data:/data
    networks:
      - cryptogram
    # time for the final RDB save on shutdown
    stop_grace_period: 1m
    restart: unless-stopped

  # `redis-cache` holds only data that can be rebuilt (the URL-preview
  # cache): own memory budget, least-recently-used eviction, no persistence,
  # so a filling cache can never push `redis` into out-of-memory errors
  redis-cache:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    environment:
      # lets valkey-cli in the healthcheck authenticate without a command-line password
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      # healthy once the server answers an authenticated PING
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    networks:
      - cryptogram
    restart: unless-stopped

  # one all-in-one `weed server` process instead of separate master/volume/filer
  # containers: -s3 implies -filer, so this single service serves master 9333,
  # volume 8080, filer 8888 and the S3 gateway on 8333. Only 8333 (alias
  # s3.local) is consumed by anything else in the stack.
  # -s3.port.iceberg=0 turns off the Iceberg REST catalog that 4.40+ otherwise
  # starts on 8181 — nothing here speaks Iceberg.
  # Volume blobs and the filer leveldb (filerldb2/) share one /data volume, so a
  # filesystem snapshot of it is atomic across blobs and metadata — see
  # SELFHOST.md for the backup and the 3-to-1 upgrade procedure.
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: "server -dir=/data -ip=seaweed -master.volumeSizeLimitMB=${SEAWEED_VOLUME_LIMIT_MB:-1024} -volume.max=0 -volume.preStopSeconds=1 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -s3.port.iceberg=0"
    restart: unless-stopped
    networks:
      cryptogram:
        aliases:
          - s3.local
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: 1
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: 1
    volumes:
      - ./s3_config/s3.selfhost.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  migrate-db:
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET=${S3_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
    # Gate on a HEALTHY db: on first boot the postgres cluster initializes
    # for several seconds, and a migrate attempt in that window dies with
    # ECONNREFUSED. The `deploy.restart_policy` retry alone does not cover
    # that window: compose maps it to a plain `on-failure:N` restart and
    # ignores its delay, so the few retries can all fire before postgres is
    # up, leaving a fresh install without a schema.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cryptogram
    restart: on-failure:3
    command: node /dist/migrateDb.js
    stop_grace_period: 1m

  wsapi:
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/wsapi.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile_dev_stage_1
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      # read only with CG_LEGACY_CGID=true (the CG ID app's RP and CORS origin)
      - CGID_URL=https://${CG_ID_DOMAIN:-}
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - CG_RECAPTCHA_SITE_KEY=${CG_RECAPTCHA_SITE_KEY}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - CG_ENABLE_CALLS=${CG_ENABLE_CALLS:-true}
      - CG_ENABLE_BLOCKCHAIN=${CG_ENABLE_BLOCKCHAIN:-true}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:-}
      - IMAGE_MODERATION_ENABLED=${CG_ENABLE_IMAGE_FILTER:-true}
      - IMAGE_MODERATION_THRESHOLD=${CG_IMAGE_FILTER_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${CG_IMAGE_FILTER_MODEL_PATH:-}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      - TWITTER_OAUTH2_CLIENT_ID=${TWITTER_OAUTH2_CLIENT_ID}
      - TWITTER_OAUTH2_CLIENT_SECRET=${TWITTER_OAUTH2_CLIENT_SECRET}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - CG_GIPHY_API_KEY=${CG_GIPHY_API_KEY}
      - CG_WALLETCONNECT_PROJECT_ID=${CG_WALLETCONNECT_PROJECT_ID}
      - PLATFORM_OPERATOR_USER_IDS=${PLATFORM_OPERATOR_USER_IDS:-}
      - BOT_USER_OWNER_LIMIT=${BOT_USER_OWNER_LIMIT:-5}
      - BOT_COMMUNITY_OWNER_LIMIT=${BOT_COMMUNITY_OWNER_LIMIT:-10}
      - BOT_PLATFORM_OWNER_LIMIT=${BOT_PLATFORM_OWNER_LIMIT:-10}
      - BOT_ACTIVE_TOKEN_LIMIT=${BOT_ACTIVE_TOKEN_LIMIT:-10}
      - BOT_API_RATE_LIMIT_PER_MINUTE=${BOT_API_RATE_LIMIT_PER_MINUTE:-120}
      - BOT_MESSAGE_RATE_LIMIT_PER_MINUTE=${BOT_MESSAGE_RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - db
      - redis
      - redis-cache
      - seaweed
      - memberlist
    networks:
      - cryptogram
      - mail-relay
    volumes:
      - "./vapid_keys.json:/run/secrets/vapid_keys_json:ro"
      - "./api_data:/api_data:ro"
    command: ["node", "/dist/api.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  memberlist:
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
    depends_on:
      - db
    networks:
      - cryptogram
    command: ["node", "/dist/memberlist.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  job-runner:
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      # receive the mail relay's bounce reports on port 2525 (mail-relay
      # network; same login as SMTP_USER/SMTP_PASSWORD)
      - MAIL_BOUNCE_RECEIVER=${CG_ENABLE_MAIL:-false}
    depends_on:
      - db
      - redis
      - seaweed
    networks:
      - cryptogram
      - mail-relay
    command: ["node", "/dist/jobs.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # voice/video calls — disable with CG_ENABLE_CALLS=false in .env.selfhost
  mediasoup:
    image: cryptogram/backend
    profiles: ["calls"]
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=mediasoup
      - PG_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - DEPLOYMENT=prod
      - HTTPS_CERT_FULLCHAIN=/dist/mediasoup/certs/selfhost/server.crt
      - HTTPS_CERT_PRIVKEY=/dist/mediasoup/certs/selfhost/server.key
      - MEDIASOUP_ANNOUNCED_IP=${CG_PUBLIC_IP}
      - DOMAIN=${CG_DOMAIN}
      - INTERACTIVE=false
      - MEDIASOUP_DISABLE_LIBURING=${MEDIASOUP_DISABLE_LIBURING:-true}
      # signalling (4443) is only reachable through Caddy, which sets X-Forwarded-For
      - MEDIASOUP_TRUST_PROXY=true
    volumes:
      - "./selfhost/certs:/dist/mediasoup/certs/selfhost:ro"
    # the `mediasoup` DB role (and its password) is created by a migration, so
    # on a fresh database the first connection fails until migrate-db is done
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - cryptogram
    command: ["node", "/dist/mediasoup.js"]
    # WebRTC media (srv/mediasoup/config.ts): worker n's WebRtcServer listens
    # on 40000+n over UDP *and* TCP — TCP is the ICE fallback for clients
    # whose network blocks UDP. With MEDIASOUP_USE_WEBRTC_SERVER=false each
    # transport takes its own port from the whole 40000-40099 range instead.
    ports:
      - "40000-40099:40000-40099/udp"
      - "40000-40099:40000-40099/tcp"
    stop_grace_period: 30s
    restart: unless-stopped

  # blockchain indexing/token gating — disable with CG_ENABLE_BLOCKCHAIN=false
  onchain:
    image: cryptogram/backend
    profiles: ["blockchain"]
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the CG_DOMAIN host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEPLOYMENT=prod
      - S3_SECRET=${S3_SECRET}
      - BASE_URL=https://${CG_DOMAIN}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - QUIKNODE_ETH=${QUIKNODE_ETH}
      - QUIKNODE_BSC=${QUIKNODE_BSC}
      - QUIKNODE_MATIC=${QUIKNODE_MATIC}
      - QUIKNODE_XDAI=${QUIKNODE_XDAI}
      - QUIKNODE_FANTOM=${QUIKNODE_FANTOM}
      - QUIKNODE_AVAX=${QUIKNODE_AVAX}
      - QUIKNODE_ARBITRUM=${QUIKNODE_ARBITRUM}
      - QUIKNODE_OPTIMISM=${QUIKNODE_OPTIMISM}
      - QUIKNODE_BASE=${QUIKNODE_BASE}
      - INFURA_LINEA=${INFURA_LINEA}
      - QUIKNODE_ARBITRUM_NOVA=${QUIKNODE_ARBITRUM_NOVA}
      - QUIKNODE_CELO=${QUIKNODE_CELO}
      - QUIKNODE_POLYGON_ZKEVM=${QUIKNODE_POLYGON_ZKEVM}
      - QUIKNODE_SCROLL=${QUIKNODE_SCROLL}
      - QUIKNODE_ZKSYNC=${QUIKNODE_ZKSYNC}
      - QUIKNODE_LUKSO=${QUIKNODE_LUKSO}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - RECALCULATE_BALANCES_AND_ROLES=${RECALCULATE_BALANCES_AND_ROLES:-false}
      - IMAGE_MODERATION_ENABLED=${CG_ENABLE_IMAGE_FILTER:-true}
      - IMAGE_MODERATION_THRESHOLD=${CG_IMAGE_FILTER_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${CG_IMAGE_FILTER_MODEL_PATH:-}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/onchain.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # send-only mail relay (maddy) — disable with CG_ENABLE_MAIL=false and point
  # SMTP_* at an external server instead (SELFHOST.md, "Email"). The app
  # submits with its relay login over the internal mail-relay network; the
  # relay DKIM-signs (key generated on first start, kept in mail-data only),
  # queues and delivers to the recipients' MX over port 25 via mail-egress.
  # No published port: inbound mail is not handled.
  mail:
    image: foxcpp/maddy:0.9.6@sha256:e1074e92a452b84d1135ebe8ab831c5f541d33dcbd39e38fab740a53bbf2f97c
    profiles: ["mail"]
    entrypoint: ["/bin/sh", "/etc/maddy/entrypoint.sh"]
    command: []
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-${CG_DOMAIN}}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-${CG_DOMAIN}}
      - MAIL_DKIM_SELECTOR=${MAIL_DKIM_SELECTOR:-cg}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ./mail:/etc/maddy:ro
      # queue, DKIM keys, MTA-STS cache (the image's sample /data/maddy.conf
      # is copied in on creation and unused)
      - mail-data:/data
    networks:
      - mail-relay
      - mail-egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    restart: unless-stopped

  cg-builder:
    build:
      context: ./node
      args:
        - BUILDER_UID=${BUILDER_UID:-1000}
        - BUILDER_GID=${BUILDER_GID:-1000}
    image: commonground/node
    user: "${BUILDER_UID:-1000}:${BUILDER_GID:-1000}"
    environment:
      - YARN_CACHE_FOLDER=/builder-cache
      - YARN_ENABLE_GLOBAL_CACHE=false
      - BUILDER_UID=${BUILDER_UID:-1000}
      - BUILDER_GID=${BUILDER_GID:-1000}
    restart: "no"
    volumes:
      - ../:/cg
      - builder-cache:/builder-cache
    networks:
      - cryptogram
    command: ["echo", "Not running interactive, exiting..."]

volumes:
  pgdata:
  valkey-data:
  seaweedfs-data:
  builder-cache:
  caddy-data:
  caddy-config:
  mail-data:

networks:
  cryptogram:
    attachable: true
  # app (api, job-runner) -> mail relay; no route to the outside
  mail-relay:
    internal: true
  # the mail relay's own way out (SMTP to the recipients' MX, port 25)
  mail-egress:

