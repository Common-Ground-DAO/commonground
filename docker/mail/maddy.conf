## Send-only mail relay of the selfhost stack (service "mail", compose profile
## "mail", docker/docker-compose.selfhost.yml) — see docker/SELFHOST.md, "Email".
##
## The app (api, job-runner) submits over the internal network with its relay
## login (SMTP_USER/SMTP_PASSWORD from .env.selfhost); this relay DKIM-signs
## each message and delivers it to the recipient's MX over port 25, queueing
## and retrying on temporary failures (greylisting, outages). No inbound mail,
## no mailboxes, no published port. Started by entrypoint.sh, which turns the
## relay password into the hash below; values come from the environment.

$(hostname) = {env:MAIL_HOSTNAME}
$(mail_domain) = {env:MAIL_DOMAIN}

hostname $(hostname)
# queue, DKIM keys, MTA-STS cache — the persistent `mail-data` volume
state_dir /data
runtime_dir /tmp
# the only listener is the plaintext submission port on the internal
# `mail-relay` network; outbound delivery still uses STARTTLS (see outbound.conf)
tls off

# the app's relay login: one user, password hash computed by entrypoint.sh
auth.pass_table relay_login {
    table static {
        entry {env:SMTP_USER} {env:MAIL_RELAY_PASSWORD_HASH}
    }
}

submission tcp://0.0.0.0:587 {
    auth &relay_login
    # plaintext AUTH is acceptable here: the port is reachable only from the
    # containers on the internal mail-relay network
    insecure_auth yes
    max_message_size 10M
    # sanity caps: the app uses at most 5 connections per process (api,
    # job-runner); maddy has no cap on the queue size itself
    limits {
        all rate 50 1s
        all concurrency 10
    }

    # only the instance's own sender domain may be relayed
    source $(mail_domain) {
        check {
            authorize_sender {
                # the relay user may use any address of the sender domain, in
                # the envelope and in the From header
                user_to_email static {
                    entry {env:SMTP_USER} $(mail_domain)
                }
                check_header yes
            }
        }
        default_destination {
            modify {
                dkim {
                    domains $(mail_domain)
                    selector {env:MAIL_DKIM_SELECTOR}
                    # generated (RSA 2048) on first start; the public half is
                    # written next to it as <domain>_<selector>.dns —
                    # `selfhost.sh mail-dns` prints it
                    key_path dkim_keys/{domain}_{selector}.key
                    # maddy's defaults plus the RFC 8058 one-click unsubscribe
                    # headers, which receivers only honour when DKIM covers them
                    oversign_fields Subject To From Date MIME-Version Content-Type Content-Transfer-Encoding Reply-To Message-Id References Autocrypt Openpgp List-Unsubscribe List-Unsubscribe-Post
                    sign_fields List-Id List-Help List-Post List-Owner List-Archive Resent-To Resent-Sender Resent-Message-Id Resent-Date Resent-From Resent-Cc
                }
            }
            deliver_to &outbound_queue
        }
    }
    default_source {
        reject 553 5.7.1 "Sender domain not allowed on this relay"
    }
}

# persistent queue in /data/outbound_queue: retries temporary failures with
# exponential back-off (15 min * 1.25^n, 20 attempts ≈ 3 days). A permanent
# failure (5xx from the recipient's server) becomes a delivery status
# notification to the envelope sender — EMAIL_FROM, i.e. an address of $(mail_domain) —
# which goes to the app's bounce receiver instead of a mailbox; the app records it
# and stops mailing an address that keeps bouncing (docs/email-notifications,
# "Bounces"). maddy reports every permanent failure as 5.0.0, and a give-up
# after the last temporary failure as 4.0.0 (ignored by the app).
target.queue outbound_queue {
    target &outbound_delivery
    max_tries 20
    autogenerated_msg_domain $(mail_domain)
    bounce {
        destination $(mail_domain) {
            deliver_to &bounce_queue
        }
        # cannot happen (only $(mail_domain) senders are accepted); never
        # send a report anywhere else
        default_destination {
            reject 550 5.7.1 "Bounce reports go to the app only"
        }
    }
}

# reports wait here while the job-runner is unreachable (restart, update).
# No bounce block: a report that cannot be delivered is only logged.
target.queue bounce_queue {
    target &bounce_receiver
    max_tries 20
}

# the bounceReceiver worker in the job-runner container (srv/jobs/
# bounceReceiver.ts), reached over the internal mail-relay network; it
# accepts the same relay login the app submits with
target.smtp bounce_receiver {
    targets tcp://job-runner:2525
    starttls no
    auth plain {env:SMTP_USER} {env:SMTP_PASSWORD}
}

# defines target `outbound_delivery`: direct MX delivery over port 25
import outbound.conf
