services:
  db:
    build:
      context: ./db
    # tag = Postgres major, so a leftover 14 image (cryptogram/db:latest) is
    # never started on the 18 mount path below — it would initialize an
    # empty cluster in an anonymous volume
    image: cryptogram/db:18
    # without an explicit config_file, postgres ignores the mounted
    # postgresql.conf and runs on image defaults
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_SU_PASSWORD}
      - PG_WRITER_PASSWORD=${PG_WRITER_PASSWORD}
      - PG_READER_PASSWORD=${PG_READER_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
    volumes:
      # Postgres 18 keeps its cluster in <volume>/18/docker. A volume from
      # Postgres 14 (cluster at the volume root) is refused at startup —
      # see "Postgres major upgrades" in docs/infrastructure/README.md
      - pgdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - cryptogram
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1m
      timeout: 5s
      retries: 5
      # fast probing during startup so dependents aren't held for the full
      # 1m interval on first boot (fresh cluster init takes several seconds)
      start_period: 2m
      start_interval: 2s
    ports:
      - 127.0.0.1:5432:5432
    stop_signal: SIGINT
    stop_grace_period: 1m
    restart: unless-stopped

  # Valkey (Redis-protocol compatible), two instances split by what may be
  # lost — see docs/infrastructure/README.md#redis-and-redis-cache-valkey.
  # `redis` holds state: sessions, the Socket.IO pub/sub, rate-limit windows,
  # replay guards, the shared captcha key, presence. No eviction (a full
  # instance refuses writes instead of silently dropping a session) and RDB
  # snapshots in a volume, so a restart does not log everyone out. A failed
  # background save must not stop writes: losing the last minutes of state on
  # a crash is better than refusing every login.
  redis:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy noeviction --save "900 1 300 100" --stop-writes-on-bgsave-error no --appendonly no
    environment:
      # lets valkey-cli in the healthcheck authenticate without a command-line password
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      # healthy once the server answers an authenticated PING
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    volumes:
      - valkey-data:/data
    networks:
      - cryptogram
    # time for the final RDB save on shutdown
    stop_grace_period: 1m
    restart: unless-stopped

  # `redis-cache` holds only data that can be rebuilt (the URL-preview
  # cache): own memory budget, least-recently-used eviction, no persistence,
  # so a filling cache can never push `redis` into out-of-memory errors
  redis-cache:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: valkey-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    environment:
      # lets valkey-cli in the healthcheck authenticate without a command-line password
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      # healthy once the server answers an authenticated PING
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    networks:
      - cryptogram
    restart: unless-stopped

  wsapi:
    image: cryptogram/backend
    environment:
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
    # the schema must be current before any query: migrate-db has to exit 0
    # first (on a fresh install and after every update that brings migrations)
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cryptogram
    command: ["node", "/dist/wsapi.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # one all-in-one `weed server` process instead of separate master/volume/filer
  # containers: -s3 implies -filer, so this single service serves master 9333,
  # volume 8080, filer 8888 and the S3 gateway on 8333. Only 8333 (alias
  # s3.local) is consumed by anything else in the stack.
  # -s3.port.iceberg=0 turns off the Iceberg REST catalog that 4.40+ otherwise
  # starts on 8181 — nothing here speaks Iceberg.
  # Volume blobs and the filer leveldb (filerldb2/) share one /data volume, so a
  # filesystem snapshot of it is atomic across blobs and metadata.
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: "server -dir=/data -ip=seaweed -master.volumeSizeLimitMB=16 -volume.max=0 -volume.preStopSeconds=1 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -s3.port.iceberg=0"
    restart: unless-stopped
    networks:
      cryptogram:
        aliases:
          - s3.local
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: 1
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: 1
    volumes:
      - ./s3_config/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  migrate-db:
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET=${S3_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
    # Gate on a HEALTHY db (same as docker-compose.selfhost.yml): on a fresh
    # volume postgres initializes for several seconds, migrateDb.js does not
    # retry, and the restart policy's immediate retries are spent before the
    # db accepts connections — leaving no schema and no `mediasoup` role.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cryptogram
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 2
        window: 60s
    command: node /dist/migrateDb.js
    # a one-shot run: the image's health check (the report of a long-running
    # process, srv/healthcheck.ts) does not apply
    healthcheck:
      disable: true
    stop_grace_period: 1m

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile_dev_stage_1
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      # read only with CG_LEGACY_CGID=true (the CG ID app's RP and CORS origin)
      - CGID_URL=${BASE_URL}/index_cgid.html
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      - TWITTER_OAUTH2_CLIENT_ID=${TWITTER_OAUTH2_CLIENT_ID}
      - TWITTER_OAUTH2_CLIENT_SECRET=${TWITTER_OAUTH2_CLIENT_SECRET}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - IMAGE_MODERATION_ENABLED=${IMAGE_MODERATION_ENABLED:-true}
      - IMAGE_MODERATION_THRESHOLD=${IMAGE_MODERATION_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${IMAGE_MODERATION_MODEL_PATH:-}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:-}
      # outgoing mail; unset = the mailpit catcher below, empty SMTP_HOST =
      # email disabled (docs/email-notifications)
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT-1025}
      - SMTP_SECURITY=${SMTP_SECURITY-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - PLATFORM_OPERATOR_USER_IDS=${PLATFORM_OPERATOR_USER_IDS:-}
      - BOT_USER_OWNER_LIMIT=${BOT_USER_OWNER_LIMIT:-5}
      - BOT_COMMUNITY_OWNER_LIMIT=${BOT_COMMUNITY_OWNER_LIMIT:-10}
      - BOT_PLATFORM_OWNER_LIMIT=${BOT_PLATFORM_OWNER_LIMIT:-10}
      - BOT_ACTIVE_TOKEN_LIMIT=${BOT_ACTIVE_TOKEN_LIMIT:-10}
      - BOT_API_RATE_LIMIT_PER_MINUTE=${BOT_API_RATE_LIMIT_PER_MINUTE:-120}
      - BOT_MESSAGE_RATE_LIMIT_PER_MINUTE=${BOT_MESSAGE_RATE_LIMIT_PER_MINUTE:-30}
    # the schema must be current before any query: migrate-db has to exit 0
    # first (on a fresh install and after every update that brings migrations)
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
      seaweed:
        condition: service_started
      memberlist:
        condition: service_started
    networks:
      - cryptogram
    volumes:
      - "./vapid_keys.json:/run/secrets/vapid_keys_json:ro"
      - "./api_data:/api_data:ro"
    command: ["node", "/dist/api.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  memberlist:
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
    # the schema must be current before any query: migrate-db has to exit 0
    # first (on a fresh install and after every update that brings migrations)
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      db:
        condition: service_started
    networks:
      - cryptogram
    command: ["node", "/dist/memberlist.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  job-runner:
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=${DEPLOYMENT}
      - BASE_URL=${BASE_URL}
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT-1025}
      - SMTP_SECURITY=${SMTP_SECURITY-none}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
    # the schema must be current before any query: migrate-db has to exit 0
    # first (on a fresh install and after every update that brings migrations)
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
      seaweed:
        condition: service_started
    networks:
      - cryptogram
    command: ["node", "/dist/jobs.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  mediasoup:
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - BASE_URL=${BASE_URL}
      - DB_TYPE=mediasoup
      - PG_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      # self-signed certificate for the hop from caddy (which terminates the
      # browser's wss on :4443) to mediasoup; generated by
      # docker/mediasoup/ensureInternalCert.sh, never seen by a browser
      - HTTPS_CERT_FULLCHAIN=/run/mediasoup-certs/server.crt
      - HTTPS_CERT_PRIVKEY=/run/mediasoup-certs/server.key
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - DOMAIN=${MEDIASOUP_ANNOUNCED_IP}
      - INTERACTIVE=false
      - LOCAL_CERTIFICATE_IP=${LOCAL_CERTIFICATE_IP}
      - MEDIASOUP_DISABLE_LIBURING=${MEDIASOUP_DISABLE_LIBURING}
      # signalling (4443) is only reachable through caddy, which sets X-Forwarded-For
      - MEDIASOUP_TRUST_PROXY=true
    volumes:
      - "./mediasoup/certs:/run/mediasoup-certs:ro"
    # the `mediasoup` DB role (and its password) is created by a migration, so
    # on a fresh database the first connection fails until migrate-db is done
    # — and with restart "no" the container would stay dead
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - cryptogram
    command: ["node", "/dist/mediasoup.js"]
    # call signalling (4443) is published by caddy
    ports:
      - "${EXTERNAL_LISTEN_IP}:40000-40099:40000-40099/udp"
    restart: "no"

  onchain:
    image: cryptogram/backend
    environment: 
      # passkeys (docs/auth-identity §7): PASSKEY_RP_ID empty = the BASE_URL host;
      # CG_LEGACY_CGID=true only on a legacy CG ID (gateway) instance
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-}
      - CG_LEGACY_CGID=${CG_LEGACY_CGID:-false}
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEPLOYMENT=${DEPLOYMENT}
      - S3_SECRET=${S3_SECRET}
      - QUIKNODE_ETH=${QUIKNODE_ETH}
      - QUIKNODE_BSC=${QUIKNODE_BSC}
      - QUIKNODE_MATIC=${QUIKNODE_MATIC}
      - QUIKNODE_XDAI=${QUIKNODE_XDAI}
      - QUIKNODE_FANTOM=${QUIKNODE_FANTOM}
      - QUIKNODE_AVAX=${QUIKNODE_AVAX}
      - QUIKNODE_ARBITRUM=${QUIKNODE_ARBITRUM}
      - QUIKNODE_OPTIMISM=${QUIKNODE_OPTIMISM}
      - QUIKNODE_BASE=${QUIKNODE_BASE}
      - INFURA_LINEA=${INFURA_LINEA}
      - QUIKNODE_ARBITRUM_NOVA=${QUIKNODE_ARBITRUM_NOVA}
      - QUIKNODE_CELO=${QUIKNODE_CELO}
      - QUIKNODE_POLYGON_ZKEVM=${QUIKNODE_POLYGON_ZKEVM}
      - QUIKNODE_SCROLL=${QUIKNODE_SCROLL}
      - QUIKNODE_ZKSYNC=${QUIKNODE_ZKSYNC}
      - QUIKNODE_LUKSO=${QUIKNODE_LUKSO}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - RECALCULATE_BALANCES_AND_ROLES=${RECALCULATE_BALANCES_AND_ROLES}
      - BASE_URL=${BASE_URL}
      - IMAGE_MODERATION_ENABLED=${IMAGE_MODERATION_ENABLED:-true}
      - IMAGE_MODERATION_THRESHOLD=${IMAGE_MODERATION_THRESHOLD:-}
      - IMAGE_MODERATION_MODEL_PATH=${IMAGE_MODERATION_MODEL_PATH:-}
    # the schema must be current before any query: migrate-db has to exit 0
    # first (on a fresh install and after every update that brings migrations)
    depends_on:
      migrate-db:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cryptogram
    command: ["node", "/dist/onchain.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # the edge (docker/caddy, Caddyfile.dev): the built frontend and the
  # routing to the backend on :8000 (HTTP) and :8001 (HTTPS), call signalling
  # on :4443. Certificates come from Caddy's local CA in the caddy-data volume;
  # ./run.sh export_ca writes its root for importing into a browser.
  caddy:
    build:
      context: ./caddy
    image: cryptogram/caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    environment:
      # the LAN address as an extra certificate name, and the certificate
      # for connections without SNI (IP addresses) — see Caddyfile.dev
      - CG_DEV_LAN_IP=${LOCAL_CERTIFICATE_IP:-}
      - CG_DEV_LAN=${LOCAL_CERTIFICATE_IP:+_on}
      - CG_DEV_DEFAULT_SNI=${LOCAL_CERTIFICATE_IP:-127.0.0.1}
    ports:
      - ${EXTERNAL_LISTEN_IP}:8000:8000
      - ${EXTERNAL_LISTEN_IP}:8001:8001
      - ${EXTERNAL_LISTEN_IP}:4443:4443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # healthy once the local CA exists (vite-tls waits for that, so the two
    # never create a CA each on a fresh volume) and the HTTP site answers
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/caddy/pki/authorities/local/root.crt && wget -q -O /dev/null http://127.0.0.1:8000/robots.txt"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    depends_on:
      - api
    networks:
      - cryptogram
    restart: unless-stopped

  # TLS for the Vite dev server, started and stopped by `./run.sh start_https`
  # (docker/caddy/Caddyfile.vite). Stock Caddy image with the config
  # bind-mounted; shares caddy-data, so it uses the caddy service's local CA —
  # and starts only once caddy has created it.
  vite-tls:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    profiles: ["vite-tls"]
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      - CG_DEV_LAN_IP=${LOCAL_CERTIFICATE_IP:-}
      - CG_DEV_LAN=${LOCAL_CERTIFICATE_IP:+_on}
      - CG_DEV_DEFAULT_SNI=${LOCAL_CERTIFICATE_IP:-127.0.0.1}
    ports:
      - ${EXTERNAL_LISTEN_IP}:3000:3000
    volumes:
      - ./caddy/Caddyfile.vite:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - cryptogram
    restart: "no"

  # catches every mail the dev stack sends (nothing leaves the machine); web
  # UI on http://<EXTERNAL_LISTEN_IP>:8025, SMTP on mailpit:1025 inside the
  # network only
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      # careful with EXTERNAL_LISTEN_IP=0.0.0.0: the web UI has no login and
      # shows every caught mail, login codes and verification links included —
      # anyone on the network could log in as any account that uses them
      - ${EXTERNAL_LISTEN_IP}:8025:8025
    networks:
      - cryptogram
    restart: unless-stopped

  hardhat:
    build:
      context: ./hardhat
    image: cryptogram/hardhat
    command: npx --no hardhat node
    user: hardhat
    ports:
      - ${EXTERNAL_LISTEN_IP}:8545:8545
    networks:
      - cryptogram
    stop_grace_period: 5s
    restart: unless-stopped

  # pgadmin:
  #   container_name: pgadmin4_container
  #   image: dpage/pgadmin4:5.5
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_SECRET}
  #     PGADMIN_LISTEN_PORT: 80
  #   ports:
  #     - 127.0.0.1:8080:80
  #   networks:
  #     - cryptogram
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin

  cg-builder:
    build:
      context: ./node
      args:
        - BUILDER_UID=${BUILDER_UID}
        - BUILDER_GID=${BUILDER_GID}
    image: commonground/node
    user: "${BUILDER_UID}:${BUILDER_GID}"
    environment:
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - BASE_URL=${BASE_URL}
      - CGID_URL=${BASE_URL}/index_cgid.html
      - S3_SECRET=${S3_SECRET}
      - YARN_CACHE_FOLDER=/builder-cache
      - YARN_ENABLE_GLOBAL_CACHE=false
      - BUILDER_UID=${BUILDER_UID}
