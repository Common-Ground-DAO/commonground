# Git dependencies Yarn may fetch. The only one in any lockfile is
# ethereumjs-abi (solidity-bytes-utils -> @truffle/hdwallet-provider ->
# web3-provider-engine -> eth-sig-util@1, in contracts/yarn.lock only since the
# root's unused Truffle devDependencies were removed), pinned there to a
# commit. Any other git dependency fails the install instead of cloning an
# arbitrary repository. srv/, sdk/ and contracts/ inherit this file (Yarn
# reads every .yarnrc.yml up the tree).
approvedGitRepositories:
  - "https://github.com/ethereumjs/ethereumjs-abi.git"

enableScripts: false

nodeLinker: node-modules

npmAlwaysAuth: false

npmMinimalAgeGate: 1w

# Security fixes that are >= 3 days but < 7 days old (UPDATE-POLICY.md,
# "Security fixes"): exact versions only, each logged there. srv/, sdk/,
# contracts/ and docker/hardhat/node/ inherit this list when Yarn runs inside
# the checkout. Remove an entry once the version is 7 days old.
npmPreapprovedPackages:
  # GHSA-4528-x5fx-h6hg, published 2026-10-28; 7 days old on 2026-11-04
  - "joi@17.13.9"
  # GHSA-mrwp-f3q8-3g9p, published 2026-10-25; 7 days old on 2026-11-01
  - "follow-redirects@1.16.2"

npmRegistryServer: "https://registry.npmjs.org/"
