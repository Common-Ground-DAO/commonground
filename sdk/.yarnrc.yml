enableScripts: false

nodeLinker: node-modules

npmAlwaysAuth: false

npmRegistryServer: "https://registry.npmjs.org/"

# Same cooldown policy as the root and srv/ packages: refuse versions published
# less than a week ago (supply-chain worm mitigation). Escape hatch:
# `yarn add --no-time-gate`, used deliberately with a note in the PR.
npmMinimalAgeGate: 1w
