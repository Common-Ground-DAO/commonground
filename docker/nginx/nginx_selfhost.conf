user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	# TLS is terminated by the caddy container in front of us; trust
	# X-Forwarded-For from the docker network
	set_real_ip_from	192.168.0.0/16;
	set_real_ip_from	172.16.0.0/12;
	set_real_ip_from	10.0.0.0/8;
	real_ip_header		X-Forwarded-For;
	real_ip_recursive	on;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_disable "msie6";

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

	map $server_name $accesscontrol {
		default "";
		"{SERVER_NAME}" "https://{SERVER_NAME}";
	}

	map $server_name $cg_csp {
		default "$cg_default_csp";
		"{SERVER_NAME}" "$cg_default_csp connect-src 'self' https://{SERVER_NAME}:* wss://{SERVER_NAME}:* wss://www.walletlink.org wss://relay.walletconnect.com https://explorer-api.walletconnect.com https://verify.walletconnect.com https://cloudflare-eth.com https://*.drpc.org https://www.google.com https://api.giphy.com https://pingback.giphy.com https://developer-access-mainnet.base.org https://rpc.gnosischain.com https://relay.farcaster.xyz https://mainnet.optimism.io https://*.g.alchemy.com https://*.publicnode.com https://polygon-rpc.com https://arb1.arbitrum.io https://rpc.ankr.com https://api.avax.network https://mainnet.era.zksync.io https://mainnet.base.org https://rpc.mainnet.lukso.network; script-src 'self' 'wasm-unsafe-eval'; script-src-elem 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com;";
	}

	# The CG ID shell's own assets (JS, CSS, manifest) are same-origin — the
	# main origin is only needed for img-src (/icons/* via APP_URL) and
	# connect-src (API calls to APP_URL/api/v2/CgId/).
	map $server_name $cg_wallet_csp {
		default "$cg_wallet_default_csp";
		"{CGID_SERVER_NAME}" "$cg_wallet_default_csp img-src 'self' 'unsafe-inline' https://{SERVER_NAME}; connect-src 'self' https://{SERVER_NAME}:* wss://{SERVER_NAME}:*; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; manifest-src 'self';";
	}

	map $server_name $cg_community {
		default "commonground";
	}

	map $server_name $cg_allow_origin {
		"{SERVER_NAME}" "https://{CGID_SERVER_NAME}";
	}

	server {
		listen 80;
		listen [::]:80;
		server_name {SERVER_NAME};

		client_max_body_size 16M;

		set $cg_default_csp "default-src 'self'; frame-ancestors 'none'; frame-src *; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net; font-src 'self' https://fonts.gstatic.com https://use.typekit.net; img-src 'self' data: blob: https://explorer-api.walletconnect.com https://ipfs.io https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com;";

		location ~ "/files/([0-9a-f]+)/([0-9a-f]+)/([0-9]{8})T([0-9]{6})Z/([1-9][0-9]{1,6})$" {
			set $id "$1";
			set $signature "$2";
			set $date "$3";
			set $datetime "$3T$4Z";
			set $expires "$5";
			set $bucket "cg-media";
			set $s3url "http://s3.local:8333";

			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host:8333;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_hide_header Set-Cookie;
			proxy_ignore_headers Set-Cookie;
			proxy_intercept_errors on;
			add_header Cache-Control "private,max-age=604800,immutable";
			add_header Access-Control-Allow-Origin $accesscontrol;
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			rewrite /files/(.*) /$bucket/$id?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cgadmin%2F$date%2Fglobal%2Fs3%2Faws4_request&X-Amz-Date=$datetime&X-Amz-Expires=$expires&X-Amz-Signature=$signature&X-Amz-SignedHeaders=host break;

			resolver 127.0.0.11 valid=10s ipv6=off;
			proxy_pass $s3url;
		}

		location ~ ^/api/bot/v1/ {
			# Stable, bearer-only Bot API v1. Keep this separate from the web app's API namespace.
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $api_upstream http://api:4000;
			rewrite ^/api/bot/v1/(.*)$ /BotV1/$1 break;
			proxy_pass $api_upstream;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			add_header Cache-Control "no-cache";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			proxy_pass_request_headers on;
		}

		location ~ ^/api/v2/(Captcha|Instance|Chat|Community|File|Message|User|Contract|Notification|Twitter|Lukso|CgId|Accounts|Plugins|Search|Report|Bot|Staking|Feed)/ {
			# config for api
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $api_upstream http://api:4000;
			rewrite /api/v2/(.*) /$1 break;
			proxy_pass $api_upstream;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			add_header Cache-Control "no-cache";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			proxy_pass_request_headers on;
		}

		location /api/ws/ {
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $wsapi_upstream http://wsapi:4000;
			proxy_pass $wsapi_upstream;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			proxy_pass_request_headers on;
		}

		location ~ ^/(c|u|gated-videos|gated-files)/ {
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $api_upstream2 http://api:4000;
			proxy_pass $api_upstream2;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			add_header Cache-Control "private,max-age=86400,must-revalidate";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			proxy_pass_request_headers on;
		}

		location ~ ^/(sitemap\.xml|twitter-callback|twitter-login|verify-email|push-icon|token-sale|token|store)/?$ {
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $api_upstream3 http://api:4000;
			proxy_pass $api_upstream3;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			add_header Cache-Control "private,max-age=86400,must-revalidate";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			proxy_pass_request_headers on;
		}

		location ~ ^/(fonts|icons|images|static|audio|downloads)/ {
			root /www;

			if ($http_origin = $cg_allow_origin) {
				add_header Access-Control-Allow-Origin "$http_origin";
			}

			add_header Cache-Control "private,max-age=86400,must-revalidate";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			include /etc/nginx/mime.types;
			try_files $uri =404;
		}

		location ~ ^/(index\.html|service-worker\.js|e/[^/]+)?$ {
			root /www;
			add_header Cache-Control "no-cache";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			include /etc/nginx/mime.types;
			try_files $uri /index.html;
		}

		location ~ "^/community/(?<commurl>[a-zA-Z0-9]{10}).*" {
			rewrite ^ /c/$commurl/ permanent;
		}

		location = /index_cgid.html {
			deny all;
		}

		location /enable-cross-origin-security {
			root /www;
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			add_header Cross-Origin-Opener-Policy "same-origin";
			add_header Cross-Origin-Embedder-Policy "require-corp";
			include /etc/nginx/mime.types;
			try_files /index.html =404;
		}

		location /disable-cross-origin-security {
			root /www;
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			include /etc/nginx/mime.types;
			try_files /index.html =404;
		}

		location / {
			root /www;

			if ($http_origin = $cg_allow_origin) {
				add_header Access-Control-Allow-Origin "$http_origin";
			}

			add_header Cache-Control "private,max-age=86400,must-revalidate";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_csp";
			include /etc/nginx/mime.types;
			# fall back to the SPA shell so deep links work before the
			# service worker takes over navigation
			try_files $uri /index.html;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name {CGID_SERVER_NAME};

		client_max_body_size 16M;

		set $cg_wallet_default_csp "default-src 'self'; frame-ancestors 'none';";

		location = /index.html {
			deny all;
		}

		location = / {
			root /www;
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_wallet_csp";
			include /etc/nginx/mime.types;
			try_files /index_cgid.html =404;
		}

		location / {
			root /www;
			add_header Cache-Control "private, must-revalidate, proxy-revalidate, max-age=0";
			add_header X-Frame-Options DENY;
			add_header X-Content-Type-Options nosniff;
			add_header Content-Security-Policy "$cg_wallet_csp";
			include /etc/nginx/mime.types;
			try_files $uri =404;
		}
	}
}
