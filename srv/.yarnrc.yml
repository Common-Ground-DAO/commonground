enableScripts: false

nodeLinker: node-modules

npmAlwaysAuth: false

npmRegistryServer: "https://registry.npmjs.org/"

# Package cooldown: refuse to install any version published less than a week
# ago. Yarn's own default is 1d; a week is what the 2026-08 keyv/cacheable worm
# argues for — those waves are detected and purged within hours, so age alone
# filters them out, while `yarn npm audit` did *not* (no GHSA existed for the
# highest-traffic poisoned packages while the attack ran).
# Cost: a genuinely urgent security fix is also delayed. Yarn's escape hatch is
# the `--no-time-gate` flag on add/up — use it deliberately, and say why in the PR.
npmMinimalAgeGate: 1w
