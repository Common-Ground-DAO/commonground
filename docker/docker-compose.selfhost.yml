# Self-hosted, single-server production deployment of Common Ground.
#
# Differences from the dev compose file (docker-compose.yml):
#   - caddy terminates TLS (Let's Encrypt) for the app, the CG ID subdomain
#     and mediasoup call signalling
#   - nginx is built from Dockerfile_selfhost (real domains, instance-config
#     injection, parameterized CSP)
#   - DEPLOYMENT=prod: full production semantics on any domain
#   - no hardhat dev chain, no test contracts
#   - postgres actually loads the tuned postgresql.conf
#   - redis maxmemory tuned for a small single machine (total budget of the
#     single redis instance; override via REDIS_MAXMEMORY)
#   - the mediasoup (calls) and onchain (blockchain) services sit behind the
#     compose profiles "calls" and "blockchain"; selfhost.sh derives
#     COMPOSE_PROFILES from CG_ENABLE_CALLS / CG_ENABLE_BLOCKCHAIN, both of
#     which default to true
#
# Usage: see docker/SELFHOST.md. Never run this with the committed dev .env —
# use docker/selfhost/init.sh to generate .env.selfhost with fresh secrets.

# distinct project name: containers and volumes stay separate from the dev
# stack (docker-compose.yml) even when both live in the same directory
name: cg-selfhost

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "4443:4443"
    environment:
      - CG_DOMAIN=${CG_DOMAIN}
      - CG_ID_DOMAIN=${CG_ID_DOMAIN}
      - CG_ACME_EMAIL=${CG_ACME_EMAIL}
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - cryptogram
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile_selfhost
      args:
        - SERVER_NAME=${CG_DOMAIN}
        - CGID_SERVER_NAME=${CG_ID_DOMAIN}
    image: cryptogram/nginx-selfhost
    environment:
      - CG_DEPLOYMENT=prod
      - CG_APP_URL=https://${CG_DOMAIN}
      - CG_CGID_URL=https://${CG_ID_DOMAIN}/#
      - CG_RECAPTCHA_SITE_KEY=${CG_RECAPTCHA_SITE_KEY}
      - CG_CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - CG_FEATURE_EMAIL=${SENDGRID_API_KEY:+true}
      - CG_FEATURE_TWITTER=${TWITTER_API_KEY:+true}
      - CG_ENABLE_CALLS=${CG_ENABLE_CALLS:-true}
      - CG_GIPHY_API_KEY=${CG_GIPHY_API_KEY}
      - CG_WALLETCONNECT_PROJECT_ID=${CG_WALLETCONNECT_PROJECT_ID}
    depends_on:
      - api
    networks:
      - cryptogram
    restart: unless-stopped

  db:
    build:
      context: ./db
    image: cryptogram/db
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_SU_PASSWORD}
      - PG_WRITER_PASSWORD=${PG_WRITER_PASSWORD}
      - PG_READER_PASSWORD=${PG_READER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - cryptogram
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1m
      timeout: 5s
      retries: 5
    stop_signal: SIGINT
    stop_grace_period: 1m
    restart: unless-stopped

  # one instance for sessions, the Socket.IO pub/sub adapter and app data —
  # the key prefixes are disjoint and nothing here is persisted (--save "").
  # No eviction policy on purpose: sessions and the captcha HMAC key are not
  # cache entries and must never be evicted. REDIS_MAXMEMORY is the total
  # budget of this one instance.
  redis:
    image: redis:6.2.7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-1536mb} --save ""
    networks:
      - cryptogram
    restart: unless-stopped

  # one all-in-one `weed server` process instead of separate master/volume/filer
  # containers: -s3 implies -filer, so this single service serves master 9333,
  # volume 8080, filer 8888 and the S3 gateway on 8333. Only 8333 (alias
  # s3.local) is consumed by anything else in the stack.
  # -s3.port.iceberg=0 turns off the Iceberg REST catalog that 4.40 otherwise
  # starts on 8181 — nothing here speaks Iceberg.
  # Volume blobs and the filer leveldb (filerldb2/) share one /data volume, so a
  # filesystem snapshot of it is atomic across blobs and metadata — see
  # SELFHOST.md for the backup and the 3-to-1 upgrade procedure.
  seaweed:
    image: chrislusf/seaweedfs:4.40
    command: "server -dir=/data -ip=seaweed -master.volumeSizeLimitMB=${SEAWEED_VOLUME_LIMIT_MB:-1024} -volume.max=0 -volume.preStopSeconds=1 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -s3.port.iceberg=0"
    restart: unless-stopped
    networks:
      cryptogram:
        aliases:
          - s3.local
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: 1
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: 1
    volumes:
      - ./s3_config/s3.selfhost.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  migrate-db:
    image: cryptogram/backend
    environment:
      - PG_SU_PASSWORD=${PG_SU_PASSWORD}
      - PG_MEDIASOUP_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - PG_SU_NAME=postgres
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET=${S3_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
    depends_on:
      - db
    networks:
      - cryptogram
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 2
        window: 60s
    command: node /dist/migrateDb.js
    stop_grace_period: 1m

  wsapi:
    image: cryptogram/backend
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      - CGID_URL=https://${CG_ID_DOMAIN}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/wsapi.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile_dev_stage_1
    image: cryptogram/backend
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - REDIS_LEGACY_MODE=true
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      - CGID_URL=https://${CG_ID_DOMAIN}
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - EMAIL_FROM=${EMAIL_FROM}
      - CG_RECAPTCHA_SITE_KEY=${CG_RECAPTCHA_SITE_KEY}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - CG_ENABLE_CALLS=${CG_ENABLE_CALLS:-true}
      - CG_ENABLE_BLOCKCHAIN=${CG_ENABLE_BLOCKCHAIN:-true}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      - TWITTER_OAUTH2_CLIENT_ID=${TWITTER_OAUTH2_CLIENT_ID}
      - TWITTER_OAUTH2_CLIENT_SECRET=${TWITTER_OAUTH2_CLIENT_SECRET}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - MAILCHIMP_API_KEY=${MAILCHIMP_API_KEY}
      - MAILCHIMP_LIST_ID=${MAILCHIMP_LIST_ID}
      - CG_GIPHY_API_KEY=${CG_GIPHY_API_KEY}
      - CG_WALLETCONNECT_PROJECT_ID=${CG_WALLETCONNECT_PROJECT_ID}
      - PLATFORM_OPERATOR_USER_IDS=${PLATFORM_OPERATOR_USER_IDS:-}
      - BOT_USER_OWNER_LIMIT=${BOT_USER_OWNER_LIMIT:-5}
      - BOT_COMMUNITY_OWNER_LIMIT=${BOT_COMMUNITY_OWNER_LIMIT:-10}
      - BOT_PLATFORM_OWNER_LIMIT=${BOT_PLATFORM_OWNER_LIMIT:-10}
      - BOT_ACTIVE_TOKEN_LIMIT=${BOT_ACTIVE_TOKEN_LIMIT:-10}
      - BOT_API_RATE_LIMIT_PER_MINUTE=${BOT_API_RATE_LIMIT_PER_MINUTE:-120}
      - BOT_MESSAGE_RATE_LIMIT_PER_MINUTE=${BOT_MESSAGE_RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - db
      - redis
      - seaweed
      - memberlist
    networks:
      - cryptogram
    volumes:
      - "./vapid_keys.json:/run/secrets/vapid_keys_json:ro"
      - "./api_data:/api_data:ro"
    command: ["node", "/dist/api.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  memberlist:
    image: cryptogram/backend
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
    depends_on:
      - db
    networks:
      - cryptogram
    command: ["node", "/dist/memberlist.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  job-runner:
    image: cryptogram/backend
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SECRET=${REDIS_SECRET}
      - DEPLOYMENT=prod
      - BASE_URL=https://${CG_DOMAIN}
      - CGID_URL=https://${CG_ID_DOMAIN}
      - S3_SECRET=${S3_SECRET}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - EMAIL_FROM=${EMAIL_FROM}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - db
      - redis
      - seaweed
    networks:
      - cryptogram
    command: ["node", "/dist/jobs.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  # voice/video calls — disable with CG_ENABLE_CALLS=false in .env.selfhost
  mediasoup:
    image: cryptogram/backend
    profiles: ["calls"]
    environment:
      - DB_TYPE=mediasoup
      - PG_PASSWORD=${PG_MEDIASOUP_PASSWORD}
      - DEPLOYMENT=prod
      - HTTPS_CERT_FULLCHAIN=/dist/mediasoup/certs/selfhost/server.crt
      - HTTPS_CERT_PRIVKEY=/dist/mediasoup/certs/selfhost/server.key
      - MEDIASOUP_ANNOUNCED_IP=${CG_PUBLIC_IP}
      - DOMAIN=${CG_DOMAIN}
      - INTERACTIVE=false
      - MEDIASOUP_DISABLE_LIBURING=${MEDIASOUP_DISABLE_LIBURING:-true}
    volumes:
      - "./selfhost/certs:/dist/mediasoup/certs/selfhost:ro"
    networks:
      - cryptogram
    command: ["node", "/dist/mediasoup.js"]
    ports:
      - "40000-40099:40000-40099/udp"
    stop_grace_period: 30s
    restart: unless-stopped

  # blockchain indexing/token gating — disable with CG_ENABLE_BLOCKCHAIN=false
  onchain:
    image: cryptogram/backend
    profiles: ["blockchain"]
    environment:
      - DB_TYPE=writer
      - PG_PASSWORD=${PG_WRITER_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEPLOYMENT=prod
      - S3_SECRET=${S3_SECRET}
      - BASE_URL=https://${CG_DOMAIN}
      - CG_ACTIVE_CHAINS=${CG_ACTIVE_CHAINS}
      - QUIKNODE_ETH=${QUIKNODE_ETH}
      - QUIKNODE_BSC=${QUIKNODE_BSC}
      - QUIKNODE_MATIC=${QUIKNODE_MATIC}
      - QUIKNODE_XDAI=${QUIKNODE_XDAI}
      - QUIKNODE_FANTOM=${QUIKNODE_FANTOM}
      - QUIKNODE_AVAX=${QUIKNODE_AVAX}
      - QUIKNODE_ARBITRUM=${QUIKNODE_ARBITRUM}
      - QUIKNODE_OPTIMISM=${QUIKNODE_OPTIMISM}
      - QUIKNODE_BASE=${QUIKNODE_BASE}
      - INFURA_LINEA=${INFURA_LINEA}
      - QUIKNODE_ARBITRUM_NOVA=${QUIKNODE_ARBITRUM_NOVA}
      - QUIKNODE_CELO=${QUIKNODE_CELO}
      - QUIKNODE_POLYGON_ZKEVM=${QUIKNODE_POLYGON_ZKEVM}
      - QUIKNODE_SCROLL=${QUIKNODE_SCROLL}
      - QUIKNODE_ZKSYNC=${QUIKNODE_ZKSYNC}
      - QUIKNODE_LUKSO=${QUIKNODE_LUKSO}
      - STAKING_CHAIN=${STAKING_CHAIN:-}
      - STAKING_TOKEN_ADDRESS=${STAKING_TOKEN_ADDRESS:-}
      - STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-}
      - STAKING_BASE_RATE=${STAKING_BASE_RATE:-}
      - STAKING_MIN_LOCK_DAYS=${STAKING_MIN_LOCK_DAYS:-}
      - STAKING_MAX_LOCK_DAYS=${STAKING_MAX_LOCK_DAYS:-}
      - RECALCULATE_BALANCES_AND_ROLES=${RECALCULATE_BALANCES_AND_ROLES:-false}
    depends_on:
      - db
      - redis
    networks:
      - cryptogram
    command: ["node", "/dist/onchain.js"]
    stop_grace_period: 1m
    restart: unless-stopped

  cg-builder:
    build:
      context: ./node
      args:
        - BUILDER_UID=${BUILDER_UID:-1000}
        - BUILDER_GID=${BUILDER_GID:-1000}
    image: commonground/node
    user: "${BUILDER_UID:-1000}:${BUILDER_GID:-1000}"
    environment:
      - YARN_CACHE_FOLDER=/builder-cache
      - YARN_ENABLE_GLOBAL_CACHE=false
      - BUILDER_UID=${BUILDER_UID:-1000}
      - BUILDER_GID=${BUILDER_GID:-1000}
    restart: "no"
    volumes:
      - ../:/cg
      - builder-cache:/builder-cache
    networks:
      - cryptogram
    command: ["echo", "Not running interactive, exiting..."]

volumes:
  pgdata:
  seaweedfs-data:
  builder-cache:
  caddy-data:
  caddy-config:

networks:
  cryptogram:
    attachable: true
